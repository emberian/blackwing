[workspace]
resolver = "2"
members = [
    "crates/engine-primitives",
    "crates/engine-world",
    "crates/engine-systems",
    "crates/engine-content",
    "crates/engine-bundle",
    "crates/engine-core",
    "crates/engine-runtime",
    "crates/engine-script",
    "crates/holdsmith-parser",
    "crates/holdsmith-compiler",
    "crates/holdsmith-analyzer",
    "crates/holdsmith-controller",
    "crates/holdsmith-app",
    "crates/holdsmith-tauri",
    "crates/holdsmith-cli",
    "crates/holdsmith-lsp",
    "crates/blackwing-game",
    "crates/blackwing-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Blackwing Contributors"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bincode = "1.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Collections
indexmap = { version = "2.0", features = ["serde"] }
smallvec = { version = "1.11", features = ["serde"] }
slotmap = { version = "1.0", features = ["serde"] }

# Scripting
rhai = { version = "1.19", features = ["sync", "serde", "internals"] }

# Parsing
logos = "0.15"

# Analysis
z3 = "0.12"

# CLI
clap = { version = "4.4", features = ["derive"] }

# LSP
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async (for profiler parallelism)
rayon = "1.8"
parking_lot = "0.12"

# Demand-driven computation
salsa = "0.25"

# Filesystem
vfs = "0.12"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
gloo-timers = "0.3"
gloo-file = "0.3"
gloo-utils = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Leptos (web UI)
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = "0.8"

# Tauri (desktop)
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Utilities
smol_str = { version = "0.3", features = ["serde"] }
once_cell = "1.19"
rustc-hash = "2.1"

# Testing
proptest = "1.4"
insta = { version = "1.34", features = ["yaml"] }
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
