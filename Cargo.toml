[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-runtime",
    "crates/engine-script",
    "crates/holdsmith-parser",
    "crates/holdsmith-compiler",
    "crates/holdsmith-analyzer",
    "crates/holdsmith-cli",
    "crates/blackwing-game",
    "crates/blackwing-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Blackwing Contributors"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Collections
indexmap = { version = "2.0", features = ["serde"] }
smallvec = { version = "1.11", features = ["serde"] }

# Scripting
rhai = { version = "1.19", features = ["sync", "serde"] }

# Analysis
z3 = "0.12"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Async (for profiler parallelism)
rayon = "1.8"
parking_lot = "0.12"

# Demand-driven computation
salsa = "0.18"

# Utilities
smol_str = { version = "0.3", features = ["serde"] }
once_cell = "1.19"
rustc-hash = "2.0"

# Testing
proptest = "1.4"
insta = { version = "1.34", features = ["yaml"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
