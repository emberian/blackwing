[package]
name = "blackwing-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Game bundle format with script support for Blackwing engine.
# Merges content (templates, dialogues, quests) and bundle loading/export.

[dependencies]
blackwing-core = { path = "../blackwing-core" }
blackwing-tilemap = { path = "../blackwing-tilemap" }
serde = { workspace = true }
thiserror = { workspace = true }
smol_str = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
toml = { workspace = true }
bincode = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
binary = ["bincode"]
archive = ["zip"]
