[package]
name = "blackwing-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine-primitives = { path = "../engine-primitives" }
engine-world = { path = "../engine-world" }
engine-systems = { path = "../engine-systems" }
engine-content = { path = "../engine-content" }
engine-bundle = { path = "../engine-bundle" }
engine-runtime = { path = "../engine-runtime" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }

# WASM-compatible random (ensures getrandom uses JS backend)
getrandom = { workspace = true }

[features]
default = ["console_error_panic_hook"]
