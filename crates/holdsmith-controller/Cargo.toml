[package]
name = "holdsmith-controller"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
z3 = ["holdsmith-analyzer/z3"]
parallel = ["holdsmith-analyzer/parallel"]

[dependencies]
engine-core = { path = "../engine-core" }
engine-runtime = { path = "../engine-runtime" }
engine-script = { path = "../engine-script" }
holdsmith-parser = { path = "../holdsmith-parser" }
holdsmith-compiler = { path = "../holdsmith-compiler" }
holdsmith-analyzer = { path = "../holdsmith-analyzer", default-features = false }

# Virtual filesystem
vfs = { workspace = true }

# Serialization (for project save/load)
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Utilities
smol_str = { workspace = true }

# Zip support for project export/import (no zstd for WASM compatibility)
zip = { workspace = true }
