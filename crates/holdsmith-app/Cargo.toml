[package]
name = "holdsmith-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
z3 = ["holdsmith-controller/z3"]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr"]
tauri = []  # Enable Tauri IPC backend

[dependencies]
holdsmith-controller = { path = "../holdsmith-controller", default-features = false }

# Leptos
leptos = { workspace = true }
leptos_meta = { workspace = true }

# WASM
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Window",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "CustomEvent",
    "FileReader",
    "Blob",
    "File",
    "FileList",
    "DragEvent",
    "DataTransfer",
] }

# Utilities
gloo-timers = { workspace = true }
gloo-file = { workspace = true }
gloo-utils = { workspace = true }
console_error_panic_hook = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-wasm = "0.2"

# WASM-compatible random (required for dependencies that use getrandom)
getrandom = { workspace = true }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

# Direct dependency for diagnostics type (no parallel for WASM)
holdsmith-analyzer = { path = "../holdsmith-analyzer", default-features = false }

# Serialization (for JS interop)
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
